    <!-- spade -->
    <path fill="url(#gold)" d="M0 -66 C 28 -30, 70 -12, 70 22 C 70 48, 44 62, 22 50 C 14 46, 8 40, 6 34 C 8 52, 16 66, 30 74 L -30 74 C -16 66, -8 52, -6 34 C -8 40, -14 46, -22 50 C -44 62, -70 48, -70 22 C -70 -12, -28 -30, 0 -66 Z"/>
