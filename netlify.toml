# Netlify hosts only the web page (public/). The game server runs on Render;
# public/config.js says where it is.
[build]
  publish = "public"
  command = ""

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"
